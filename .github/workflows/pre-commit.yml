name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  pre-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install pre-commit==4.6.0

      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Annotate failures
        if: failure()
        run: |
          echo "::warning::Pre-commit checks failed. Please run 'pre-commit run --all-files' locally and commit the fixes."

  test:
    runs-on: ubuntu-latest
    needs: pre-commit

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.1.2
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: pytest --cov=core --cov=analytics --cov=integrations --cov-report=term-missing

      - name: Annotate failures
        if: failure()
        run: |
          echo "::warning::Tests failed. Please run 'pytest' locally and fix the failures."
